name: LOC V30 MAITRE owner browser isolation
on:
  pull_request:
    paths:
      - 'LOC/MASTER-MAITRE-LOC/gestion.html'
      - 'tests/loc-v30-master-owner-browser.spec.cjs'
      - 'tests/loc-v30-master-owner-playwright.config.cjs'
      - '.github/workflows/loc-v30-master-owner-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  template-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Test generic owner template against synthetic data only
        run: npx playwright test --config=tests/loc-v30-master-owner-playwright.config.cjs --workers=1 --reporter=line
